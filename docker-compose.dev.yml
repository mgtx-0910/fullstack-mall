services:
  mysql:
    image: mysql:8.4
    container_name: fullstack-mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: fullstack_dev_root_password
      MYSQL_DATABASE: fullstack_mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: mall_dev_password
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - fullstack-mall-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pfullstack_dev_root_password"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: fullstack-mall-redis
    ports:
      - "6379:6379"
    volumes:
      - fullstack-mall-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  fullstack-mall-mysql-data:
  fullstack-mall-redis-data:
