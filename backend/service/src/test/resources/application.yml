spring:
  application:
    name: fullstack-mall-service
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:fullstack_mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5
      validation-query: SELECT 1
      test-while-idle: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-schema.sql
      data-locations: classpath:db/test-data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

security:
  jwt:
    secret: ZnVsbHN0YWNrLW1hbGwtdGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS0zMi1ieXRlcw==
    expiration-seconds: 1800


mall:
  payment:
    mock-callback-secret: ${MOCK_PAYMENT_CALLBACK_SECRET:your-local-mock-payment-secret}
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    close-scan-fixed-delay-ms: ${ORDER_CLOSE_SCAN_FIXED_DELAY_MS:60000}
    close-scan-batch-size: ${ORDER_CLOSE_SCAN_BATCH_SIZE:100}
  cache:
    product-detail:
      # 原有测试默认绕过 Redis，避免单元/集成测试依赖本机服务。
      enabled: false
      value-ttl: 10m
      null-ttl: 30s
