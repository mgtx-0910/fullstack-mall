spring:
  application:
    name: fullstack-mall-service
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3308/fullstack_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mall}
    password: ${DB_PASSWORD:mall_dev_password}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      stat-view-servlet:
        enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  # 普通开发启动默认使用 8080；也可以通过 SERVER_PORT 环境变量覆盖。
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # 不在公开仓库内置默认密钥；本地启动前请设置 JWT_SECRET。
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}


mall:
  payment:
    mock-callback-secret: ${MOCK_PAYMENT_CALLBACK_SECRET:your-local-mock-payment-secret}
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    close-scan-fixed-delay-ms: ${ORDER_CLOSE_SCAN_FIXED_DELAY_MS:60000}
    close-scan-batch-size: ${ORDER_CLOSE_SCAN_BATCH_SIZE:100}
  cache:
    product-detail:
      enabled: ${MALL_PRODUCT_CACHE_ENABLED:true}
      value-ttl: ${MALL_PRODUCT_CACHE_VALUE_TTL:10m}
      null-ttl: ${MALL_PRODUCT_CACHE_NULL_TTL:30s}
